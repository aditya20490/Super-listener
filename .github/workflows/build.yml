name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repo code
        uses: actions/checkout@v4

      - name: Get the music player code (read only, your old repo is not changed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/my-music-app
          path: old-music

      - name: Get the tag editor code (read only, your old repo is not changed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/audio-tag-editor
          path: old-tags

      - name: Get the Music Finder code (read only, your old repo is not changed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/music-finder-app
          path: old-finder

      - name: Get the Task Automator code (read only, your old repo is not changed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Task-automater
          path: old-automator

      - name: Get the Vocal Splitter code (read only, your old repo is not changed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/VocalSplitter
          path: old-splitter

      - name: Get the Voice Cloner code (read only, your old repo is not changed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/voice-studio
          path: old-voice

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Speed up builds with cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Keep the voice downloads between builds (so only the first build downloads them)
        uses: actions/cache@v4
        with:
          path: tts-cache
          key: tts-kokoro-v1_0-sherpa-1.13.7

      - name: Keep the Vocal Splitter model between builds (so only the first build downloads it)
        uses: actions/cache@v4
        with:
          path: studio-cache
          key: studio-vocal-model-uvr-mdx-voc-ft-v1

      - name: Pack the tag editor page
        run: node make-tag-editor.js

      - name: Add the Island row to the menu
        run: node patch-tools.js

      - name: Pack the Music Finder data and link it into the player
        run: |
          node make-finder.js
          node patch-finder.js
          node patch-studio.js
          node patch-stats.js
          node patch-karaoke.js || echo "WARNING: the Karaoke button could not be added, building without it"
          node patch-home-finder.js || echo "WARNING: the Home Screen online results could not be added, building without them"   # <-- NEW LINE

      - name: Create the app project
        run: |
          # Pinned to SDK 54: the newest SDK forces React Native's new architecture,
          # which react-native-track-player 4.1.2 can't run on (app opens and closes at once)
          npx create-expo-app@latest musicapp --template blank@sdk-54
          cd musicapp
          rm -rf App.tsx App.js src
          cp ../App.js App.js
          cp ../old-music/App.js MusicApp.js
          cp -r ../old-music/src src
          mkdir -p src/tools
          cp ../src/tools/* src/tools/
          npx expo install expo-media-library expo-file-system expo-image-picker expo-linear-gradient react-native-safe-area-context @expo/vector-icons expo-font @react-native-async-storage/async-storage expo-clipboard react-native-webview expo-web-browser expo-splash-screen
          npx expo install --fix
          npm install react-native-track-player@4.1.2
          # track-player's Kotlin code breaks with the newest React Native (Bundle? vs Bundle), so we fix those 2 lines here
          MM=node_modules/react-native-track-player/android/src/main/java/com/doublesymmetry/trackplayer/module/MusicModule.kt
          sed -i -e 's/\.tracks\[index\]\.originalItem))/.tracks[index].originalItem ?: android.os.Bundle()))/' -e 's/^\( *musicService\.tracks\[musicService\.getCurrentTrackIndex()\]\.originalItem\)$/\1 ?: android.os.Bundle()/' "$MM"
          echo "Patched lines:"; grep -n "originalItem" "$MM" || true
          npm install @missingcore/react-native-metadata-retriever@^3.2.1 || echo "Song details library failed to install, continuing without it"
          npx expo install expo-notifications || echo "The reminders library failed to install, continuing without it"

      - name: Make the start screen files (plain black, with your symbol)
        run: |
          cd musicapp
          node ../make-splash.js

      - name: Set app name, package and permissions
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd musicapp
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const run = parseInt(process.env.RUN_NUMBER, 10);
          cfg.expo.name = 'Music Plus';
          cfg.expo.slug = 'music-plus';
          cfg.expo.version = '1.0.' + run;
          cfg.expo.userInterfaceStyle = 'automatic';
          cfg.expo.newArchEnabled = false;
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.package = 'com.mymusic.plus';
          cfg.expo.android.versionCode = run;
          cfg.expo.android.permissions = [
            'android.permission.READ_MEDIA_AUDIO',
            'android.permission.READ_EXTERNAL_STORAGE',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
            'android.permission.WAKE_LOCK',
            'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
            'android.permission.INTERNET'
          ];
          cfg.expo.plugins = [
            'expo-media-library',
            ['expo-splash-screen', { backgroundColor: '#000000', image: './assets/splash-blank.png', imageWidth: 200 }]
          ];
          if (fs.existsSync('node_modules/expo-notifications')) cfg.expo.plugins.push('expo-notifications');
          delete cfg.expo.splash;
          fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Build APK
        run: |
          set +e
          GRADLE_PROPS='\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n'
          # our own native parts (8D engine, file saver, Dynamic Island), copied into the Android project and registered
          add_native() {
            # Music Finder: pulls the Task Automator engine into the Android project and registers its bridge
            node ../link-finder.js || exit 1

            # Text to Speech: the offline Kokoro voices. If this fails, the app is still built, just without voices.
            node ../link-tts.js || echo "WARNING: the voice engine could not be added, building without voices"
            # Vocal Splitter + Voice Cloner inside the hamburger menu. If this fails, this build attempt stops and the next one is made without them.
            node ../link-studio.js || exit 1
            # Karaoke (the K button): uses the Vocal Splitter's engine. If it is not linked, or the build fails with it, it is dropped on its own.
            node ../link-karaoke.js || echo "WARNING: Karaoke could not be added, building without it"

            K=android/app/src/main/java/com/mymusic/player
            mkdir -p "$K"
            cp ../old-music/native-android/*.kt "$K/"
            cp ../native-android/*.kt "$K/"

            # the Island: two services in the manifest + the accessibility settings file
            MF=android/app/src/main/AndroidManifest.xml
            if ! grep -q "IslandService" "$MF"; then
              sed -i '/<\/application>/e cat ../native-android/island-manifest.xml' "$MF"
            fi
            mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
            cat > android/app/src/main/res/xml/island_service.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100"
              android:description="@string/island_desc" />
          XML
            cat > android/app/src/main/res/values/island_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="island_desc">Draws the music pill (Dynamic Island) on top of other apps. It does not read or collect anything from your screen.</string>
          </resources>
          XML

            MA=$(find android/app/src/main/java -name 'MainApplication.*' | head -1)
            if grep -q "EightDPackage" "$MA"; then return; fi
            sed -i 's/PackageList(this).packages.apply {/&\n              add(com.mymusic.player.EightDPackage())/' "$MA"
            echo "MainApplication check:"; grep -n "EightDPackage" "$MA" || echo "WARNING: native package was not registered"
          }
          # one full build attempt in a fresh Android project (uses SKIP_TTS to leave the voices out)
          build_once() (
            cd musicapp
            rm -rf android
            npx expo prebuild --platform android
            add_native
            printf "$GRADLE_PROPS" >> android/gradle.properties
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a 2>&1 | tee "$1"
            exit ${PIPESTATUS[0]}
          )
          error_summary() {
            echo '```'
            grep -E "^e: " "$1" | head -15
            sed -n '/What went wrong/,/Try:/p' "$1" | head -30
            echo '```'
          }

          # attempt 1: everything (song details library + offline voices + Vocal Splitter + Voice Cloner)
          unset SKIP_TTS SKIP_STUDIO SKIP_KARAOKE
          build_once /tmp/gradle1.log
          if [ "$?" -eq 0 ]; then
            if [ -f musicapp/android/app/src/main/java/com/mymusic/player/TtsModule.kt ]; then
              VOICES="The offline voices (Kokoro Text to Speech) are INCLUDED."
            else
              VOICES="The offline voices (Kokoro Text to Speech) are NOT included, they could not be downloaded or linked. Look at the 'Build APK' step log."
            fi
            if [ -f musicapp/android/app/src/main/java/com/mymusic/player/StudioAppsModule.kt ]; then
              STUDIO="Vocal Splitter and Voice Cloner are INCLUDED."
            else
              STUDIO="Vocal Splitter and Voice Cloner are NOT included."
            fi
            if [ -f musicapp/android/app/src/main/java/com/mymusic/player/KaraokeModule.kt ]; then
              KARAOKE="Karaoke (the K button) is INCLUDED."
            else
              KARAOKE="Karaoke (the K button) is NOT included."
            fi
            echo "Build $GITHUB_RUN_NUMBER: the song details library (artist, album, covers, lyrics) is INCLUDED. $VOICES $STUDIO $KARAOKE" > release_notes.md
            exit 0
          fi

          # attempt 1b: everything except Karaoke (Karaoke is the newest part: if it breaks the build, only it is dropped)
          echo "First build failed, trying again without Karaoke"
          export SKIP_KARAOKE=1
          build_once /tmp/gradle1b.log
          if [ "$?" -eq 0 ]; then
            {
              echo "Build $GITHUB_RUN_NUMBER: everything is INCLUDED except Karaoke (the K button), because the first build failed with it."
              echo ""
              echo "Error summary:"
              error_summary /tmp/gradle1.log
            } > release_notes.md
            exit 0
          fi
          unset SKIP_KARAOKE

          # attempt 2: without Vocal Splitter and Voice Cloner (the same build as before they were added)
          echo "First build failed, trying again without Vocal Splitter and Voice Cloner"
          export SKIP_STUDIO=1
          build_once /tmp/gradle2.log
          if [ "$?" -eq 0 ]; then
            {
              echo "Build $GITHUB_RUN_NUMBER: the song details library and the offline voices are INCLUDED. Vocal Splitter and Voice Cloner are NOT included, because the first build failed with them."
              echo ""
              echo "Error summary:"
              error_summary /tmp/gradle1.log
            } > release_notes.md
            exit 0
          fi

          # attempt 3: also without the offline voices
          echo "Second build failed, trying again without the offline voices too"
          export SKIP_TTS=1
          build_once /tmp/gradle3.log
          if [ "$?" -eq 0 ]; then
            {
              echo "Build $GITHUB_RUN_NUMBER: the song details library is INCLUDED. The offline voices, Vocal Splitter and Voice Cloner are NOT included, because the earlier builds failed."
              echo ""
              echo "Error summary (first build, with everything):"
              error_summary /tmp/gradle1.log
              echo ""
              echo "Error summary (second build, without Vocal Splitter and Voice Cloner):"
              error_summary /tmp/gradle2.log
            } > release_notes.md
            exit 0
          fi

          # attempt 4: also without the song details library
          echo "Third build failed, trying again without the song details library too"
          {
            echo "Build $GITHUB_RUN_NUMBER: the song details library, the offline voices, Vocal Splitter and Voice Cloner were NOT included, because the earlier builds failed."
            echo ""
            echo "Error summary (first build, with everything):"
            error_summary /tmp/gradle1.log
            echo ""
            echo "Error summary (second build, without Vocal Splitter and Voice Cloner):"
            error_summary /tmp/gradle2.log
            echo ""
            echo "Error summary (third build, without the offline voices):"
            error_summary /tmp/gradle3.log
          } > release_notes.md
          export SKIP_TTS=1 SKIP_STUDIO=1
          (cd musicapp && npm uninstall @missingcore/react-native-metadata-retriever || true)
          build_once /tmp/gradle4.log
          BUILD_RESULT=$?
          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "ALL FOUR BUILD ATTEMPTS FAILED"
            echo "---- first attempt errors ----";  error_summary /tmp/gradle1.log
            echo "---- last attempt errors ----";   error_summary /tmp/gradle4.log
          fi
          exit $BUILD_RESULT

      - name: Check the APK exists
        run: |
          APK=musicapp/android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          test -s "$APK"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body_path: release_notes.md
          files: musicapp/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
